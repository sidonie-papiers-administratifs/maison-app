<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maison · Bibliothèque & Cuisine</title>

  <meta name="theme-color" content="#0b0d12" />
  <link rel="manifest" href="manifest.json" />

  <style>
    :root{
      --bg:#0b0d12;
      --bg2:#0f1320;
      --card:#141a2a;
      --card2:#101629;
      --txt:#eef2ff;
      --muted:#9aa3b2;
      --line:rgba(255,255,255,.10);
      --shadow:0 20px 60px rgba(0,0,0,.55);
      --radius:18px;

      --accent:#7c3aed;
      --accent2:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;

      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1100px 650px at 15% -10%, rgba(124,58,237,.25), transparent),
        radial-gradient(950px 520px at 88% 15%, rgba(34,197,94,.14), transparent),
        radial-gradient(750px 450px at 25% 90%, rgba(245,158,11,.10), transparent),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color:var(--txt);
    }

    a{color:inherit}
    .wrap{max-width:1200px;margin:0 auto;padding:16px}
    header{
      position:sticky;top:0;z-index:20;
      backdrop-filter: blur(12px);
      background: rgba(11,13,18,.78);
      border-bottom:1px solid var(--line);
    }
    .top{
      display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap
    }
    h1{margin:0;font-size:22px;letter-spacing:1px}
    .sub{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.35}
    .pillbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 14px;border-radius:999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color:var(--txt);
      cursor:pointer;
      font-size:14px;
      user-select:none;
      transition:.18s;
    }
